name: "web build"
on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Also deploy to GitHub Pages (Settings > Pages > Source must be 'GitHub Actions')"
        type: boolean
        default: false

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply web port patch
        run: |
          git apply --3way --exclude='.github/*' openomori-web-port.patch
          git status --short

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (the end-to-end ones need Chrome and a real game install)
        run: bun test src

      - name: Build client + service worker
        run: bun run build

      # The Bun dev server maps / -> public/index.html and /app.js, /sw.js, /vendor/* -> dist/.
      # A static host has to serve the same layout, so assemble it here.
      - name: Assemble static site
        run: |
          mkdir -p build/web
          cp public/index.html build/web/index.html
          cp -r dist/. build/web/
          # Pages is Jekyll by default; keep it from touching files starting with _
          touch build/web/.nojekyll
          find build/web -type f | head -50
          du -sh build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_pages }}
        with:
          path: build/web

  deploy:
    if: ${{ inputs.deploy_pages }}
    needs: export
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
